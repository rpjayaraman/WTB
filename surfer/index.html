<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <!-- change this to your project name -->
    <title>Surfer</title>

    <script>
    // ─── Boot: clear stale Surfer state only (do not touch app localStorage) ──
    try {
      Object.keys(window.localStorage || {}).forEach(k => {
        if (k.startsWith('surfer') || k.startsWith('egui') || k.startsWith('eframe')) {
          window.localStorage.removeItem(k);
        }
      });
      Object.keys(window.sessionStorage || {}).forEach(k => {
        if (k.startsWith('surfer') || k.startsWith('egui') || k.startsWith('eframe')) {
          window.sessionStorage.removeItem(k);
        }
      });
      if ('indexedDB' in window && indexedDB.databases) {
        indexedDB.databases().then(dbs => {
          dbs.forEach(db => { if (db.name && db.name.includes('surfer')) indexedDB.deleteDatabase(db.name); });
        }).catch(() => {});
      }
    } catch (e) {}

    // ─── Fallback VCD (prevents WASM panic on first fetch before data arrives) ─
    const DEFAULT_DUMMY_VCD = "$date\n  2026-08-13\n$end\n$version\n  WhatTheBug\n$end\n$timescale 1ns $end\n$scope module top $end\n$var wire 1 ! clk $end\n$upscope $end\n$enddefinitions $end\n#0\n$dumpvars\n0!\n$end\n#5\n1!\n#10\n0!\n";

    // ─── JS fetch monkey-patch: intercept any vcd-data fetch in WASM context ──
    // Must happen SYNCHRONOUSLY before the module script so WASM sees patched fetch
    if (!window._surferFetchPatched) {
      window._surferFetchPatched = true;
      const _orig = window.fetch;
      window.fetch = function(input, init) {
        let u = (typeof input === 'string') ? input
              : (input && input.url) ? input.url
              : String(input);
        if (u && (u.includes('vcd-data') || u.includes('current.vcd'))) {
          const content = window._currentVcdText || DEFAULT_DUMMY_VCD;
          console.log('[surfer] fetch intercepted for VCD URL, content length:', content.length);
          return Promise.resolve(new Response(content, {
            status: 200, statusText: 'OK',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8',
              'Access-Control-Allow-Origin': '*',
              'Cache-Control': 'no-cache, no-store'
            }
          }));
        }
        return _orig.apply(this, arguments);
      };
    }

    // ─── Helper: inject WASM message (with optional queue if WASM not ready) ──
    function _injectMsg(msgObj) {
      if (typeof window.inject_message === 'function') {
        try {
          console.log('[surfer] Injecting WASM message:', Object.keys(msgObj)[0]);
          window.inject_message(JSON.stringify(msgObj));
        } catch(e) {
          console.error('[surfer] inject_message error:', e);
        }
      } else {
        console.log('[surfer] Queueing WASM message until initialized:', Object.keys(msgObj)[0]);
        window._pendingVcdMsg = msgObj;
      }
    }

    // ─── Helper: load VCD by passing content directly to WASM (no URL/fetch involved) ──
    // In Rust, LoadFromData takes (Vec<u8>, LoadOptions).
    // Serde JSON expects a sequence of bytes for Vec<u8> and "Clear" for LoadOptions.
    function _loadVcdViaSW(vcdText) {
      window._currentVcdText = vcdText;
      console.log('[surfer] Loading VCD data into WASM (length: ' + vcdText.length + ' bytes)');
      const byteArray = Array.from(new TextEncoder().encode(vcdText));
      _injectMsg({ LoadFromData: [byteArray, 'Clear'] });
    }

    // ─── Message listener: receive commands from parent page ──────────────────
    window.addEventListener('message', (event) => {
      const d = event.data;
      if (!d || !d.command) return;

      switch (d.command) {
        case 'LoadVcdData':
          if (d.data) _loadVcdViaSW(d.data);
          break;

        case 'LoadUrl': {
          let url = d.url;
          try { url = new URL(d.url, window.location.origin).href; } catch(e) {}
          // For external URLs, we use LoadWaveformFileFromUrl with 'Clean' load option
          _injectMsg({ LoadWaveformFileFromUrl: [url, 'Clean'] });
          break;
        }

        case 'ToggleMenu':
          _injectMsg('ToggleMenu');
          break;

        case 'InjectMessage':
          _injectMsg(d.message);
          break;

        default:
          console.log('[surfer] Unknown command:', d.command);
      }
    });
    </script>


    <script>
        function on_surfer_error(msg) {
            console.error("[surfer] Panic caught:", msg);
            var errEl = document.getElementById("error_message");
            if (errEl) errEl.innerHTML = msg;
            var errBox = document.getElementById("error_container");
            if (errBox) errBox.style.display = "block";
        }
        window.on_surfer_error = on_surfer_error;
    </script>
    
    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base href="./" />

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                background: #404040;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error_container {
            padding: 1em;
            border-radius: 0.5em;
            margin: 0px auto;
            max-width: 980px;
            color: #ffffff;
            background-color: black;
            position: relative;
            height: 90%;
            overflow: scroll;
        }

        #error_container a {
            color: #ff9999;
        }

        #error_message {
            overflow: scroll;
            white-space: break-spaces;
        }
    </style>
</head>

<body>
    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs . so, make sure both match. -->
    <canvas id="the_canvas_id"></canvas>

    <!-- config for our rust wasm binary. Run AFTER canvas exists in DOM -->
    <script type="module">
        import init, { WebHandle, inject_message, id_of_name, draw_text_arrow } from './surfer.js';
        await init({ module_or_path: './surfer_bg.wasm' });
        window.inject_message = inject_message;
        window.id_of_name = id_of_name;
        window.draw_text_arrow = draw_text_arrow;
        /*SURFER_SETUP_HOOKS*/
        if (window._pendingVcdMsg && typeof window.inject_message === 'function') {
          try {
            console.log('[surfer/index.html] WASM initialized, sending queued VCD message');
            window.inject_message(JSON.stringify(window._pendingVcdMsg));
            window._pendingVcdMsg = null;
          } catch(e) {
            console.error('[surfer/index.html] Error sending queued VCD message:', e);
          }
        }
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'surfer_ready' }, '*');
          }
        } catch(e) {}
    </script>

    <div id="error_container" style="display: none;">
        <h1>Sorry, Surfer crashed 🔥</h1>
        <p>
            Something caused Surfer to crash. Please report the error on
            <a href="https://gitlab.com/surfer-project/surfer/-/issues/new">
                gitlab
            </a>
        </p>
        <p>
            Any report is appreciated, but it is extra helpful if you can attach the waveform that caused
            the crash and/or the steps to reproduce the crash.
        </p>
        <h3>
            Backtrace:
        </h3>
        <div class="error_container">
            <!-- This is filled in by javascript -->
            <code id="error_message"></code>
        </div>
    </div>

    <!-- Service Worker registration -->
    <script>
        // We disable caching during development so that we always view the latest version.
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVM Methodology Coding — What the Bug</title>
    <link rel="stylesheet" href="common.css?v=3">
    <!-- CodeMirror Editor Stylesheet and Monokai Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.1.0/skins/default.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.1.0/wavedrom.min.js"></script>
    <!-- Supabase Auth Script dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
</head>
<body>
    <div class="workspace-wrapper">
        <!-- Top App Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="app-logo">⚡ <span>WHAT THE BUG</span></div>
                <nav class="header-links">
                    <a href="index.html">Dashboard</a>
                    <a href="sv_coding.html" class="active">Modules</a>
                    <a href="waveform_demo.html">Waveform Sandbox</a>
                    <a href="dataset_manager.html">Dataset Manager</a>
                </nav>
            </div>
            <div class="header-right">
                <div class="nav-progress" id="navProgress">Completed: 0%</div>
                <div class="header-actions">
                    <button class="sub-header-btn" id="themeToggler" title="Switch Theme">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Sub Header Bar -->
        <div class="sub-header" style="justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="sub-header-btn" id="toggleSidebar" title="Toggle Sidebar">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="breadcrumbs">
                    <span id="breadcrumb_topic">UVM METHODOLOGY</span>
                    <span class="separator">/</span>
                    <span id="breadcrumb_question" style="color: var(--text-primary);">Loading...</span>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 0.8rem;">
                <!-- Speed Run Stopclock Widget -->
                <div class="stopclock-widget">
                    <span class="stopclock-label">⏱ SPEED RUN</span>
                    <span class="stopclock-display" id="stopclock_time">10:00</span>
                    <button class="stopclock-btn" id="stopclock_play_btn" onclick="StopclockWidget.toggle()" title="Start / Pause Timer">▶</button>
                    <button class="stopclock-btn" onclick="StopclockWidget.reset()" title="Reset Timer">↺</button>
                </div>

                <button class="btn btn-primary btn-sm" onclick="QuestionLoader.triggerSim()" style="padding: 0.25rem 0.8rem; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; border-radius: var(--radius-full);">
                    ▶ Run Simulation
                </button>
            </div>
        </div>

        <div class="workspace-container dual-pane-container">
            <!-- Left Column: Design RTL Files -->
            <section class="pane-column" style="flex: 1;">
                <div class="pane-header-bar">
                    <div class="pane-title-badge">
                        <span style="color: var(--neon-cyan);">⚙️ 1. DESIGN RTL</span>
                    </div>
                    <div class="pane-file-tabs" id="design_file_tabs">
                        <!-- Dynamically populated from common.js -->
                    </div>
                </div>
                <div class="pane-editor-body">
                    <textarea id="design_code_editor" readonly></textarea>
                </div>
            </section>

            <!-- Right Column: Testbench Files & Simulation -->
            <section class="pane-column" style="flex: 1.2;">
                <div class="pane-header-bar">
                    <div class="pane-title-badge">
                        <span style="color: var(--neon-magenta);">🧪 2. TESTBENCH</span>
                    </div>
                    <div class="pane-file-tabs" id="editor_tab_bar">
                        <!-- Dynamically populated from common.js -->
                    </div>
                </div>

                <div class="pane-editor-body">
                    <textarea id="code_editor" placeholder="Write your SystemVerilog solution here..."></textarea>
                </div>

                <div class="resizer-v" id="console_resizer" title="Drag vertically to resize console/waveform window"></div>
                <div class="console-pane">
                    <div class="console-header">
                        <div class="console-tabs">
                            <button class="tab-btn active" id="tab_console" onclick="QuestionLoader.switchTab('console')">Console Output</button>
                            <button class="tab-btn" id="tab_waveform" onclick="QuestionLoader.switchTab('waveform')">Waveform Viewer</button>
                            <button class="tab-btn" id="tab_wavedrom" onclick="QuestionLoader.switchTab('wavedrom')">WaveDrom</button>
                            <button class="tab-btn" id="tab_coverage" onclick="QuestionLoader.switchTab('coverage')">Coverage Report</button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <button class="btn btn-secondary btn-sm" id="btn_download_wavedrom_png" onclick="downloadWaveDromPNG()" style="display: none; align-items: center; gap: 4px;">📥 Download PNG</button>
                            <button class="btn btn-secondary btn-sm" onclick="QuestionLoader.triggerLint()">Lint Only</button>
                        </div>
                    </div>
                    <div class="console-body" id="console_output">press ▶ to run</div>
                    <div class="console-body" id="waveform_output" style="display: none; padding: 0 !important; overflow: auto; background: #0d1117; position: relative;">
                        <canvas id="waveform_canvas" style="display: block;"></canvas>
                    </div>
                    <div class="console-body" id="wavedrom_output" style="display: none; padding: 1rem; overflow: auto; background: #ffffff; color: #000000; position: relative;">
                        <!-- WaveDrom SVG -->
                    </div>
                    <div class="console-body" id="coverage_output" style="display: none; padding: 0 !important; overflow: auto; background: var(--bg-secondary); position: relative;">
                        <!-- Coverage Report -->
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- CodeMirror Editor Javascripts and VIM bindings -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/verilog/verilog.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/keymap/vim.min.js"></script>

    <script src="db_metadata.js?v=13"></script>
    <script src="common.js?v=13"></script>
    <script>
        const questions = (typeof DV_QUESTIONS_METADATA !== 'undefined' && DV_QUESTIONS_METADATA.uvm_coding) ? DV_QUESTIONS_METADATA.uvm_coding : [];
        QuestionLoader.init('uvm_coding', questions);
    </script>
</body>
</html>
